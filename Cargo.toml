[package]
name = "bunny-sync"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
bunny-api-tokio = { path = "../bunny-api-tokio", version = "0.4.0", features = ["edge_storage"] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
hex = "0.4"
sha2 = "0.10"
tokio = { version = "1.50.0", features = ["full"] }
walkdir = "2"
